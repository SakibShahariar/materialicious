name: Missing icon request
description: Request a missing application or system icon.
title: "Icon request: "
body:
  - type: input
    id: app
    attributes:
      label: App or icon name
      placeholder: Firefox, org.mozilla.firefox, or folder-download
    validations:
      required: true
  - type: textarea
    id: missing
    attributes:
      label: What is missing?
      description: Tell us which icon you expected to see.
      placeholder: The app shows a generic icon instead of its official logo.
    validations:
      required: true
  - type: input
    id: source
    attributes:
      label: App or icon link (optional)
      placeholder: https://example.org/
    validations:
      required: false
  - type: textarea
    id: extra
    attributes:
      label: Screenshot or extra details (optional)
      description: Add these only if they help explain the request.
    validations:
      required: false
